jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: restapidb
          MYSQL_USER: spq
          MYSQL_PASSWORD: spq
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Wait for MySQL to be ready
      run: |
        apt-get update
        apt-get install -y wait-for-it
        wait-for-it mysql:3306 --timeout=60 --strict -- echo "MySQL is ready"
    - name: Build with client Maven
      run: mvn -B package --file client/pom.xml
    - name: Build with vinted Maven
      run: mvn -B package --file vintedServer/pom.xml
